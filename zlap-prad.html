<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Złap Prąd! — gra o trolejbusie | ProTVDO</title>
<meta name="description" content="Złap Prąd! — prosta gra zręcznościowa. Prowadź trolejbus pod przewodami trakcyjnymi i zbieraj punkty." />
<meta name="robots" content="noindex, follow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --neon-cyan:#4deaff;
    --neon-yellow:#ffe14d;
    --neon-pink:#ff4de3;
    --panel:#14141c;
    --panel-border:rgba(255,255,255,0.12);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    overflow:hidden;
    background:#0a0a10;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #game{position:fixed;inset:0;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}

  .hud{
    position:absolute;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(12px + env(safe-area-inset-top)) 14px 0;
    pointer-events:none;
    font-weight:800;color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  .hud .score-box{font-size:clamp(22px,6vw,32px);line-height:1;}
  .hud .score-box small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--neon-yellow);opacity:.9;margin-bottom:2px;}
  .hud .mult{font-size:13px;font-weight:700;color:var(--neon-cyan);margin-top:4px;opacity:0;transition:opacity .2s;}
  .hud .mult.show{opacity:1;}
  .lives{display:flex;gap:6px;}
  .lives span{font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));transition:transform .2s;}
  .lives span.lost{opacity:.25;filter:grayscale(1);}

  .btn-round{
    position:absolute;top:calc(10px + env(safe-area-inset-top));right:14px;
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,0.08);border:1px solid var(--panel-border);
    color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;
    pointer-events:auto;cursor:pointer;
  }
  #muteBtn{top:calc(56px + env(safe-area-inset-top));}

  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:radial-gradient(ellipse at 50% 30%, rgba(40,20,60,0.85), rgba(6,6,12,0.95));
    backdrop-filter:blur(2px);
  }
  .overlay.hidden{display:none;}
  .title{
    font-size:clamp(30px,9vw,52px);font-weight:800;
    color:#fff;
    text-shadow:0 0 10px var(--neon-cyan),0 0 28px rgba(77,234,255,.6);
    margin-bottom:6px;
  }
  .subtitle{color:rgba(255,255,255,0.75);font-size:clamp(13px,3.6vw,16px);font-weight:500;max-width:360px;margin-bottom:22px;line-height:1.55;}
  .subtitle b{color:var(--neon-yellow);font-weight:700;}
  .play-btn{
    font-family:inherit;font-weight:800;font-size:19px;color:#0a0a10;
    background:linear-gradient(135deg,var(--neon-yellow),#ffb84d);
    border:none;border-radius:999px;padding:16px 44px;cursor:pointer;
    box-shadow:0 8px 24px rgba(255,225,77,0.35), 0 0 0 3px rgba(255,255,255,0.08) inset;
    transition:transform .12s;
  }
  .play-btn:active{transform:scale(.96);}
  .howto{
    display:flex;gap:18px;margin-top:26px;color:rgba(255,255,255,0.6);font-size:12px;font-weight:600;
  }
  .howto div{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:90px;}
  .howto .ico{font-size:22px;}

  .final-score{font-size:clamp(46px,16vw,80px);font-weight:800;color:var(--neon-yellow);text-shadow:0 0 20px rgba(255,225,77,.6);line-height:1;}
  .best-line{color:rgba(255,255,255,0.7);font-size:14px;font-weight:600;margin:10px 0 24px;}
  .best-line b{color:var(--neon-cyan);}

  #reconnectOverlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #reconnectOverlay.hidden{display:none;}
  .zap-word{
    font-size:clamp(30px,10vw,54px);font-weight:800;color:var(--neon-yellow);
    text-shadow:0 0 18px rgba(255,225,77,.8);
    animation:pulse .35s infinite alternate;
  }
  @keyframes pulse{from{transform:scale(1);}to{transform:scale(1.12);}}
  .taps-left{margin-top:6px;font-size:16px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  .timebar-wrap{width:140px;height:8px;border-radius:5px;background:rgba(255,255,255,0.2);margin-top:14px;overflow:hidden;}
  .timebar{height:100%;background:linear-gradient(90deg,var(--neon-pink),var(--neon-yellow));border-radius:5px;}

  .tap-zones{position:absolute;inset:0;display:flex;}
  .tap-zones div{flex:1;}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div class="tap-zones"><div id="zoneL"></div><div id="zoneR"></div></div>

  <div class="hud">
    <div class="score-box">
      <small>WYNIK</small>
      <span id="scoreVal">0</span>
      <div class="mult" id="multVal">x1.0</div>
    </div>
    <div class="lives" id="livesBox"></div>
  </div>

  <button class="btn-round" id="muteBtn" aria-label="Wycisz">🔊</button>

  <div id="reconnectOverlay" class="overlay hidden" style="background:transparent;backdrop-filter:none;">
    <div class="zap-word">KLIKAJ!⚡</div>
    <div class="taps-left" id="tapsLeft">5 razy</div>
    <div class="timebar-wrap"><div class="timebar" id="timeBar"></div></div>
  </div>

  <div id="startScreen" class="overlay">
    <div class="title">⚡ Złap Prąd! ⚡</div>
    <div class="subtitle">Prowadź trolejbus pod przewodami trakcyjnymi. Im dłużej jedziesz idealnie pod kablem, tym szybciej rosną punkty!</div>
    <button class="play-btn" id="playBtn">Zagraj</button>
    <div class="howto">
      <div><span class="ico">👈</span>lewa strona ekranu = lewy pas</div>
      <div><span class="ico">👉</span>prawa strona ekranu = prawy pas</div>
      <div><span class="ico">🔌</span>zgubisz kabel? klikaj szybko!</div>
    </div>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <div class="subtitle" style="margin-bottom:0;font-weight:700;color:rgba(255,255,255,.85);">BZZZT! Wypadłeś z linii</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="best-line">Najlepszy wynik: <b id="bestScore">0</b></div>
    <button class="play-btn" id="retryBtn">Jeszcze raz</button>
  </div>
</div>

<script>
(function(){
"use strict";

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var W=0, H=0;

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- audio (procedural, no files) ---------- */
var audioCtx = null, muted = false;
function ensureAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq, dur, type, gain, glideTo){
  if(muted || !audioCtx) return;
  var t0 = audioCtx.currentTime;
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0+dur);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain||0.15, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sndTap(){ beep(520,0.06,'square',0.08); }
function sndBuzz(){
  if(muted || !audioCtx) return;
  var t0 = audioCtx.currentTime;
  var buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.35, audioCtx.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  var src = audioCtx.createBufferSource(); src.buffer = buf;
  var filt = audioCtx.createBiquadFilter(); filt.type='bandpass'; filt.frequency.value=180;
  var g = audioCtx.createGain(); g.gain.setValueAtTime(0.35,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+0.35);
  src.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
  src.start(t0);
}
function sndSuccess(){ beep(660,0.09,'sine',0.14); setTimeout(function(){beep(880,0.14,'sine',0.14);},90); }
function sndLoseLife(){ beep(220,0.25,'sawtooth',0.12,110); }
function sndGameOver(){ beep(300,0.3,'sawtooth',0.1,90); }

document.getElementById('muteBtn').addEventListener('click', function(){
  muted = !muted;
  this.textContent = muted ? '🔇' : '🔊';
});

/* ---------- game constants ---------- */
var LANES = 3;
var ROAD_FRAC = 0.7;
var BUS_Y_FRAC = 0.78;
var GRACE = 70;
var BASE_SPEED = 230;
var MAX_SPEED_ADD = 260;
var MAX_LIVES = 3;
var TAPS_NEEDED = 5;
var RECONNECT_TIME = 3.0;

function laneX(lane){
  var roadW = W*ROAD_FRAC;
  var left = (W-roadW)/2;
  return left + roadW*( (lane+0.5)/LANES );
}
function roadEdges(){
  var roadW = W*ROAD_FRAC;
  var left = (W-roadW)/2;
  return {left:left, right:left+roadW};
}

/* ---------- state ---------- */
var state = 'start'; // start | playing | reconnecting | gameover
var score = 0, best = 0;
var lives = MAX_LIVES;
var busLane = 1;
var busDrawX = 0;
var scrollY = 0;
var speed = BASE_SPEED;
var alignedTime = 0;
var mult = 1;
var segments = [];
var particles = [];
var reconnectTapsLeft = TAPS_NEEDED;
var reconnectTimeLeft = RECONNECT_TIME;
var flashT = 0;
var stars = [];

try{ best = parseInt(localStorage.getItem('zlapprad_best')||'0',10) || 0; }catch(e){ best = 0; }

function initStars(){
  stars = [];
  for(var i=0;i<40;i++){
    stars.push({x:Math.random()*1, y:Math.random()*0.55, r:Math.random()*1.6+0.4, tw:Math.random()*Math.PI*2});
  }
}
initStars();

function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }

function newSegment(fromLane, dStart){
  var lane;
  do { lane = randInt(0,LANES-1); } while(lane===fromLane && LANES>1);
  var len = randInt(230,430);
  var seg = { fromLane:fromLane, lane:lane, dStart:dStart, dEnd:dStart+len, obstacles:[] };
  for(var l=0;l<LANES;l++){
    if(l===lane) continue;
    if(Math.random()<0.55){
      seg.obstacles.push({
        lane:l,
        d: dStart + len*(0.25+Math.random()*0.5),
        color: Math.random()<0.5 ? '#3d6bd6' : '#c94b4b',
        kind: Math.random()<0.7 ? 'car':'cone'
      });
    }
  }
  return seg;
}

function resetTrack(){
  segments = [ { fromLane:1, lane:1, dStart:-400, dEnd:420, obstacles:[] } ];
  while(segments[segments.length-1].dEnd < 1200){
    var last = segments[segments.length-1];
    segments.push(newSegment(last.lane, last.dEnd));
  }
}

function ensureTrackAhead(){
  var last = segments[segments.length-1];
  while(last.dEnd < scrollY + H + 300){
    last = newSegment(last.lane, last.dEnd);
    segments.push(last);
  }
  while(segments.length>4 && segments[1].dEnd < scrollY - H) segments.shift();
}

function currentSegment(){
  for(var i=0;i<segments.length;i++){
    var s = segments[i];
    if(scrollY>=s.dStart && scrollY<s.dEnd) return s;
  }
  return segments[segments.length-1];
}

function wireValidLanes(seg){
  if(scrollY < seg.dStart + GRACE){
    return [seg.fromLane, seg.lane];
  }
  return [seg.lane];
}

/* ---------- lifecycle ---------- */
function startGame(){
  ensureAudio();
  score = 0; lives = MAX_LIVES; busLane = 1; busDrawX = laneX(1);
  scrollY = 0; speed = BASE_SPEED; alignedTime = 0; mult = 1;
  particles = [];
  state = 'playing';
  resetTrack();
  updateHUD();
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('reconnectOverlay').classList.add('hidden');
  lastT = performance.now();
  requestAnimationFrame(loop);
}

function updateHUD(){
  document.getElementById('scoreVal').textContent = Math.floor(score);
  var mEl = document.getElementById('multVal');
  if(mult>1.02){ mEl.textContent = 'x'+mult.toFixed(1); mEl.classList.add('show'); }
  else mEl.classList.remove('show');
  var box = document.getElementById('livesBox');
  var html = '';
  for(var i=0;i<MAX_LIVES;i++){
    html += '<span class="'+(i<lives?'':'lost')+'">🦺</span>';
  }
  box.innerHTML = html;
}

function triggerDisconnect(){
  if(state!=='playing') return;
  state = 'reconnecting';
  mult = 1; alignedTime = 0;
  reconnectTapsLeft = TAPS_NEEDED;
  reconnectTimeLeft = RECONNECT_TIME;
  flashT = 0.25;
  sndBuzz();
  if(navigator.vibrate) navigator.vibrate(120);
  document.getElementById('tapsLeft').textContent = reconnectTapsLeft+' razy';
  document.getElementById('timeBar').style.width = '100%';
  document.getElementById('reconnectOverlay').classList.remove('hidden');
}

function reconnectTap(){
  if(state!=='reconnecting') return;
  reconnectTapsLeft--;
  sndTap();
  if(navigator.vibrate) navigator.vibrate(15);
  document.getElementById('tapsLeft').textContent = Math.max(reconnectTapsLeft,0)+' razy';
  if(reconnectTapsLeft<=0){
    var seg = currentSegment();
    busLane = seg.lane;
    state = 'playing';
    sndSuccess();
    document.getElementById('reconnectOverlay').classList.add('hidden');
  }
}

function loseLife(){
  lives--;
  updateHUD();
  document.getElementById('reconnectOverlay').classList.add('hidden');
  if(lives<=0){
    endGame();
  } else {
    sndLoseLife();
    var seg = currentSegment();
    busLane = seg.lane;
    state = 'playing';
  }
}

function endGame(){
  state = 'gameover';
  sndGameOver();
  if(score>best){
    best = Math.floor(score);
    try{ localStorage.setItem('zlapprad_best', String(best)); }catch(e){}
  }
  document.getElementById('finalScore').textContent = Math.floor(score);
  document.getElementById('bestScore').textContent = best;
  document.getElementById('reconnectOverlay').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.remove('hidden');
}

/* ---------- input ---------- */
function moveLane(dir){
  if(state!=='playing') return;
  busLane = Math.max(0, Math.min(LANES-1, busLane+dir));
}
document.getElementById('zoneL').addEventListener('pointerdown', function(e){
  ensureAudio();
  if(state==='reconnecting') reconnectTap();
  else if(state==='playing') moveLane(-1);
  else if(state==='start') startGame();
});
document.getElementById('zoneR').addEventListener('pointerdown', function(e){
  ensureAudio();
  if(state==='reconnecting') reconnectTap();
  else if(state==='playing') moveLane(1);
  else if(state==='start') startGame();
});
window.addEventListener('keydown', function(e){
  if(e.code==='ArrowLeft') moveLane(-1);
  else if(e.code==='ArrowRight') moveLane(1);
  else if(state==='reconnecting') reconnectTap();
  else if(state==='start' && e.code==='Space') startGame();
});
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

/* ---------- particles ---------- */
function spawnSpark(x,y){
  particles.push({
    x:x+(Math.random()*10-5), y:y,
    vx:(Math.random()*2-1)*40, vy:-40-Math.random()*60,
    life:0.4+Math.random()*0.3, age:0,
    color: Math.random()<0.5 ? '#4deaff' : '#ffe14d'
  });
}
function updateParticles(dt){
  for(var i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.age += dt;
    if(p.age>=p.life){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 90*dt;
  }
}

/* ---------- update ---------- */
var lastT = 0;
function update(dt){
  if(state==='playing'){
    scrollY += speed*dt;
    speed = BASE_SPEED + Math.min(MAX_SPEED_ADD, score*0.045);
    ensureTrackAhead();

    var seg = currentSegment();
    var valid = wireValidLanes(seg);
    var aligned = valid.indexOf(busLane)!==-1;

    if(aligned){
      alignedTime += dt;
      mult = 1 + Math.min(4, alignedTime*0.5);
      score += (14*mult)*dt;
      if(Math.random() < dt*14){
        spawnSpark(laneX(busLane), H*BUS_Y_FRAC - 34);
      }
    } else {
      triggerDisconnect();
    }
  } else if(state==='reconnecting'){
    reconnectTimeLeft -= dt;
    document.getElementById('timeBar').style.width = Math.max(0,(reconnectTimeLeft/RECONNECT_TIME)*100)+'%';
    if(reconnectTimeLeft<=0){
      loseLife();
    }
  }

  var targetX = laneX(busLane);
  busDrawX += (targetX-busDrawX)*Math.min(1, dt*10);

  if(flashT>0) flashT = Math.max(0, flashT-dt);

  updateParticles(dt);
  updateHUD();
}

/* ---------- draw ---------- */
function screenY(d){ return H*BUS_Y_FRAC - (d - scrollY); }

function draw(){
  ctx.clearRect(0,0,W,H);

  var sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#241736');
  sky.addColorStop(0.45,'#3a2150');
  sky.addColorStop(0.75,'#6b3159');
  sky.addColorStop(1,'#1a1220');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff';
  for(var i=0;i<stars.length;i++){
    var s = stars[i];
    var tw = 0.5+0.5*Math.sin(s.tw + performance.now()*0.002);
    ctx.globalAlpha = 0.25+0.5*tw;
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  var edges = roadEdges();
  ctx.fillStyle = 'rgba(20,14,28,0.55)';
  var skylineOffset = (scrollY*0.15)%80;
  for(var bx=-80; bx<W+80; bx+=80){
    var bh = 60+((Math.floor((bx+skylineOffset)/80)*37)%90);
    ctx.fillRect(bx-(skylineOffset%80), H*0.42-bh, 56, bh);
  }

  ctx.fillStyle = '#232030';
  ctx.fillRect(edges.left, 0, edges.right-edges.left, H);

  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=2;
  ctx.setLineDash([18,18]);
  for(var lidx=1; lidx<LANES; lidx++){
    var lx = edges.left + (edges.right-edges.left)*(lidx/LANES);
    ctx.lineDashOffset = -scrollY*1.4;
    ctx.beginPath();
    ctx.moveTo(lx,0); ctx.lineTo(lx,H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  ctx.strokeStyle='rgba(255,255,255,0.5)';
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(edges.left,0); ctx.lineTo(edges.left,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(edges.right,0); ctx.lineTo(edges.right,H); ctx.stroke();

  for(var pd=Math.floor((scrollY-H)/200)*200; pd<scrollY+H; pd+=200){
    var py = screenY(pd);
    drawPole(edges.left-8, py);
    drawPole(edges.right+8, py);
  }

  for(var si=0; si<segments.length; si++){
    var seg = segments[si];
    if(seg.dEnd<scrollY-100 || seg.dStart>scrollY+H+100) continue;
    for(var oi=0;oi<seg.obstacles.length;oi++){
      var ob = seg.obstacles[oi];
      var oy = screenY(ob.d);
      if(oy<-40||oy>H+40) continue;
      drawObstacle(laneX(ob.lane), oy, ob);
    }
  }

  drawWire();

  for(var i2=0;i2<particles.length;i2++){
    var p = particles[i2];
    var a = 1 - p.age/p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.4*a+0.6, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawBus();

  if(flashT>0){
    ctx.fillStyle = 'rgba(255,255,255,'+(flashT*1.6)+')';
    ctx.fillRect(0,0,W,H);
  }
}

function drawPole(x,y){
  ctx.strokeStyle='rgba(255,255,255,0.25)';
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(x,y+4); ctx.lineTo(x,y-46);
  ctx.stroke();
}

function drawObstacle(x,y,ob){
  ctx.save();
  ctx.translate(x,y);
  if(ob.kind==='car'){
    ctx.fillStyle = ob.color;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(-20,-12,40,24,6); else ctx.rect(-20,-12,40,24);
    ctx.fill();
    ctx.fillStyle='#111';
    ctx.beginPath(); ctx.arc(-12,12,5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(12,12,5,0,Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle='#ff8a2b';
    ctx.beginPath();
    ctx.moveTo(0,-16); ctx.lineTo(14,12); ctx.lineTo(-14,12); ctx.closePath();
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillRect(-9,2,18,4);
  }
  ctx.restore();
}

function drawWire(){
  var pts = [];
  for(var si=0; si<segments.length; si++){
    var seg = segments[si];
    if(seg.dEnd<scrollY-50 || seg.dStart>scrollY+H+50) continue;
    pts.push({d:seg.dStart, x:laneX(seg.fromLane)});
    pts.push({d:seg.dStart+GRACE, x:laneX(seg.lane)});
    pts.push({d:seg.dEnd, x:laneX(seg.lane)});
  }
  if(pts.length<2) return;

  var mult2 = mult;
  var glow = 6 + (mult2-1)*10;
  ctx.save();
  ctx.shadowColor = 'rgba(77,234,255,0.9)';
  ctx.shadowBlur = glow;
  ctx.strokeStyle = '#bff4ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  for(var i=0;i<pts.length;i++){
    var y = screenY(pts[i].d);
    if(i===0) ctx.moveTo(pts[i].x,y); else ctx.lineTo(pts[i].x,y);
  }
  ctx.stroke();
  ctx.restore();
}

function drawBus(){
  var x = busDrawX;
  var y = H*BUS_Y_FRAC;
  var w = 64, h = 92;

  var seg = currentSegment();
  var wireX = laneX((scrollY<seg.dStart+GRACE) ? seg.lane : seg.lane);
  var aligned = state==='playing';

  ctx.save();
  ctx.strokeStyle = aligned ? 'rgba(255,255,255,0.5)' : 'rgba(255,80,80,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x-10, y-h*0.42);
  ctx.lineTo(wireX, screenY(scrollY)+2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+10, y-h*0.42);
  ctx.lineTo(wireX, screenY(scrollY)+2);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  var glowColor = aligned ? '#4deaff' : '#ff5a5a';
  ctx.shadowColor = glowColor;
  ctx.shadowBlur = aligned ? (10+(mult-1)*10) : 14;

  ctx.fillStyle = '#2c6fe0';
  roundRectPath(x-w/2, y-h/2, w, h, 12);
  ctx.fill();

  ctx.fillStyle = '#ffe14d';
  roundRectPath(x-w/2, y-h*0.02, w, h*0.16, 3);
  ctx.fill();

  ctx.fillStyle = 'rgba(180,225,255,0.85)';
  roundRectPath(x-w/2+7, y-h/2+10, w-14, h*0.3, 6);
  ctx.fill();

  ctx.restore();

  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(x-w/2+8, y+h/2-4, 7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w/2-8, y+h/2-4, 7,0,Math.PI*2); ctx.fill();
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------- loop ---------- */
function loop(t){
  var dt = Math.min(0.05, (t-lastT)/1000 || 0);
  lastT = t;
  update(dt);
  draw();
  if(state!=='gameover' || true) requestAnimationFrame(loop);
}

draw();
})();
</script>
