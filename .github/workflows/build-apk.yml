name: Build Android APK (Trolley Bus Driver)

on:
  push:
    branches: [main]
    paths:
      - "trolley_bus_driver_app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trolley_bus_driver_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.5"
          channel: "stable"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # UPDATE_NUMBER/UPDATE_DATE feed the player-facing update stamp on the
      # start screen (see kUpdateNumber in lib/main.dart). Keep UPDATE_NUMBER in
      # sync with the versionCode in pubspec.yaml for release builds; CI debug
      # builds just reuse the run number.
      - run: |
          flutter build apk --debug \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=UPDATE_NUMBER=${{ github.run_number }} \
            --dart-define=UPDATE_DATE=$(date -u +%Y-%m-%d)

      - uses: actions/upload-artifact@v4
        with:
          name: trolley-bus-driver-debug-apk-${{ github.run_number }}
          path: trolley_bus_driver_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
